<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glossa – Online Interpreter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.png">

  <style>
    body {
      font-family: monospace;
      background: #2c0202;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    textarea {
      width: 90%;
      height: 240px;
      background: #120000;
      color: #fff;
      border: 1px solid #aa4444;
      padding: 10px;
      font-size: 15px;
    }

    button {
      margin: 15px;
      padding: 10px 25px;
      font-size: 16px;
      background: #aa4444;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #cc6666;
    }

    pre {
      width: 90%;
      margin: auto;
      background: #120000;
      border: 1px solid #aa4444;
      padding: 10px;
      min-height: 120px;
      text-align: left;
      white-space: pre-wrap;
    }

    .btn-github {
      margin-top: 25px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .btn-github:hover {
      transform: scale(1.1);
      color: #ffaaaa;
    }
  </style>
</head>

<body>

<h1><u>Glossa-Online</u></h1>


<textarea id="code">
emfanise "Kalos Irthes!"
</textarea>

<br>
<button onclick="run()">Run ▶</button>

<pre id="output"></pre>

<a class="btn-github" href="https://github.com/BEIMYT/Glossa" target="_blank">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 1.333A6.667 6.667 0 0 0 1.333 8c0 2.94 1.914 5.44 4.56 6.333.333.054.44-.146.44-.326v-1.14c-1.86.4-2.254-.9-2.254-.9-.307-.774-.754-.98-.754-.98-.607-.414.047-.406.047-.406.667.047 1.287.666 1.32 1.367.027.52.18.96.48 1.28-1.534.167-3.074-.774-3.074-3.88 0-.854.3-1.6.807-2.174-.08-.2-.327-1.06.093-2.207 0 0 .653-.214 2.14.8.62-.174 1.287-.26 1.947-.26.66 0 1.327.086 1.947.26 1.487-1.014 2.14-.8 2.14-.8.42 1.147.173 2.007.093 2.207.507.574.807 1.32.807 2.174 0 3.12-1.547 3.84-3.02 4.04.24.207.44.614.44 1.247v 1.847c0 .18.107.38.44.326 2.646-.893 4.56-3.393 4.56-6.333A6.667 6.667 0 0 0 8 1.333Z"/>
  </svg>
  View on GitHub
</a>

<script>
let vars = {};
let out = "";

function print(v="") { out += v + "\n"; }

function evalExpr(expr) {
  // Replace operators carefully
  expr = expr.replace(/<>/g, "!=")
             .replace(/<=/g, "LTEQ")
             .replace(/>=/g, "GTEQ")
             .replace(/=/g, "==")
             .replace(/LTEQ/g, "<=")
             .replace(/GTEQ/g, ">=");
  try {
    return Function("vars", "with(vars){return " + expr + "}")(vars);
  } catch {
    return false;
  }
}

function runBlock(lines) {
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;

    let cmd = line.split(/\s+/)[0];

    // Assignment: var <- expr
    if (line.includes("<-")) {
      let parts = line.split("<-");
      let varName = parts[0].trim();
      let expr = parts[1].trim();
      vars[varName] = evalExpr(expr);
    }

    // Print
    else if (cmd === "emfanise" || cmd === "ektipose") {
      let arg = line.slice(cmd.length).trim();
      if (arg.startsWith('"') && arg.endsWith('"')) {
        print(arg.slice(1, -1));
      } else {
        print(vars[arg] ?? evalExpr(arg));
      }
    }

    // IF / ELSE IF / ELSE
    else if (cmd === "an") {
      let blocks = [];
      let current = { type: "an", cond: "", body: [] };

      while (i < lines.length && !lines[i].includes("telos_an")) {
        let l = lines[i].trim();

        if (l.startsWith("an ") && i === lines.findIndex(x => x.trim().startsWith("an "))) {
          current.cond = l.split("tote")[0].replace("an", "").trim();
        }
        else if (l.startsWith("alios_an")) {
          blocks.push(current);
          current = {
            type: "alios_an",
            cond: l.split("tote")[0].replace("alios_an", "").trim(),
            body: []
          };
        }
        else if (l === "alios") {
          blocks.push(current);
          current = { type: "alios", body: [] };
        }
        else if (!l.startsWith("an ")) {
          current.body.push(l);
        }
        i++;
      }
      blocks.push(current);

      for (let b of blocks) {
        if (b.type === "alios" || evalExpr(b.cond)) {
          runBlock(b.body);
          break;
        }
      }
    }

    else {
      print("Δεν αναγνωρίζω την εντολή: " + line);
    }
  }
}

function run() {
  vars = {};
  out = "";
  runBlock(document.getElementById("code").value.split("\n"));
  document.getElementById("output").textContent = out;
}
</script>

</body>
</html>
