<!DOCTYPE html><html><head><title>ΣΟΘ</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>body{margin:0;padding:0;background:#333;font-family:Arial,sans-serif}#pdf-container{width:100%;height:100vh;position:relative;overflow:auto;background:white}canvas{display:block;margin:0 auto}.page-wrapper{position:relative;margin-bottom:10px}#controls{position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,0.8);color:white;padding:15px;border-radius:5px;font-size:12px;z-index:100}</style></head><body><div id="pdf-container"></div><div id="controls"><div id="visitor-id"></div><div id="page-info"></div></div><script>document.addEventListener('contextmenu',(e)=>{e.preventDefault();return false});document.addEventListener('keydown',(e)=>{if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();return false}if((e.ctrlKey||e.metaKey)&&(e.key==='p'||e.key==='P')){e.preventDefault();return false}});const visitorId='V-'+Date.now()+'-'+Math.random().toString(36).substr(2,9).toUpperCase();const timestamp=new Date().toLocaleString();document.getElementById('visitor-id').textContent='ID: '+visitorId;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdfPath='SOΤΗ.pdf';let pdfDoc=null;let pageNum=1;let pageRendering=false;let pageNumPending=null;function addWatermark(canvas){const ctx=canvas.getContext('2d');const width=canvas.width;const height=canvas.height;ctx.save();ctx.globalAlpha=0.15;ctx.font='bold 60px Arial';ctx.fillStyle='#000000';ctx.textAlign='center';ctx.rotate(-45*Math.PI/180);for(let x=-width;x<width*2;x+=400){for(let y=-height;y<height*2;y+=300){ctx.fillText(visitorId,x,y)}}ctx.globalAlpha=0.1;ctx.font='bold 40px Arial';for(let x=-width;x<width*2;x+=600){for(let y=-height;y<height*2;y+=400){ctx.fillText(timestamp,x,y+80)}}ctx.restore()}function renderPage(num){if(pageRendering){pageNumPending=num;return}pageRendering=true;pdfDoc.getPage(num).then(function(page){const canvas=document.createElement('canvas');const context=canvas.getContext('2d');const viewport=page.getViewport({scale:2.0});canvas.height=viewport.height;canvas.width=viewport.width;const renderContext={canvasContext:context,viewport:viewport};page.render(renderContext).promise.then(function(){addWatermark(canvas);const wrapper=document.createElement('div');wrapper.className='page-wrapper';wrapper.appendChild(canvas);document.getElementById('pdf-container').appendChild(wrapper);pageRendering=false;if(pageNumPending!==null){renderPage(pageNumPending);pageNumPending=null}})});document.getElementById('page-info').textContent='Page '+num+' of '+pdfDoc.numPages}pdfjsLib.getDocument(pdfPath).promise.then(function(pdf){pdfDoc=pdf;for(let i=1;i<=pdfDoc.numPages;i++){renderPage(i)}});document.addEventListener('selectstart',(e)=>{e.preventDefault();return false});document.addEventListener('copy',(e)=>{e.preventDefault();return false})</script></body></html>
